services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-healthforecast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthforecast}
      POSTGRES_DB: ${POSTGRES_DB:-healthforecast}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-healthforecast} -d ${POSTGRES_DB:-healthforecast}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - appnet
    # Bound to loopback only so local development can reach it; not exposed publicly.
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-healthforecast}:${POSTGRES_PASSWORD:-healthforecast}@postgres:5432/${POSTGRES_DB:-healthforecast}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SEED_DB: ${SEED_DB:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    ports:
      - "8000:8000"
    networks:
      - appnet

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "3000:80"
    networks:
      - appnet

volumes:
  postgres_data:

networks:
  appnet:
    driver: bridge
