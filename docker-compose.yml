services:
  mongodb:
    image: mongo:6.0
    container_name: prognexa-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
    ports:
      - "27017:27017"
    networks:
      - prognexa-network

  backend:
    build: ./backend
    container_name: prognexa-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017/
      DB_NAME: ${DB_NAME:-prognexa}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    ports:
      - "8000:8000"
    networks:
      - prognexa-network

  frontend:
    build: ./frontend
    container_name: prognexa-frontend
    restart: unless-stopped
    environment:
      API_BASE: /api
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - prognexa-network

volumes:
  mongo-data:

networks:
  prognexa-network:
    driver: bridge