<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Analytics Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">
        Analytics Dashboard
    </h2>

    <div class="row">

        <div class="col-md-3">

            <div class="card bg-primary text-white">

                <div class="card-body">

                    <h4>Total Predictions</h4>

                    <h2>{{ total }}</h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card bg-danger text-white">

                <div class="card-body">

                    <h4>High Risk</h4>

                    <h2>{{ high }}</h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card bg-warning">

                <div class="card-body">

                    <h4>Moderate Risk</h4>

                    <h2>{{ moderate }}</h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card bg-success text-white">

                <div class="card-body">

                    <h4>Low Risk</h4>

                    <h2>{{ low }}</h2>

                </div>

            </div>

        </div>

    </div>
<hr class="my-5">

<h3 class="text-center mb-4">
    Patient Risk Distribution
</h3>
<hr class="my-5">

<h3 class="text-center mb-4">
    Patient Risk Analysis
</h3>

<div class="row">

    <div class="col-md-6 text-center">

        <h5>Pie Chart</h5>

        <img src="{{ url_for('static', filename='charts/pie_chart.png') }}"
             class="img-fluid"
             width="450">

    </div>

    <div class="col-md-6 text-center">

        <h5>Bar Chart</h5>

        <img src="{{ url_for('static', filename='charts/bar_chart.png') }}"
             class="img-fluid"
             width="500">

    </div>

</div>

    <div class="text-center mt-5">

        <a href="{{ url_for('dashboard') }}" class="btn btn-success">
            Back to Dashboard
        </a>

    </div>

</div>

</body>

</html>
