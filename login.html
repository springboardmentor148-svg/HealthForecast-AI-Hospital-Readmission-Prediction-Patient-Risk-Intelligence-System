<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Diabetes Readmission Prediction System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1565C0, #42A5F5);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            overflow: auto;
        }

        /* Background circles */

        body::before {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(255, 255, 255, .12);
            border-radius: 50%;
            top: -120px;
            left: -120px;
        }

        body::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, .08);
            border-radius: 50%;
            bottom: -100px;
            right: -100px;
        }

        .login-card {
            position: relative;
            z-index: 2;
            width: 420px;
            max-width: 100%;
            background: white;
            border-radius: 20px;
            padding: 30px 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18);
            animation: fadeIn .8s ease;
        }

        .logo {
            width: 70px;
            height: 70px;
            background: #1565C0;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            margin: auto;
            margin-bottom: 15px;
        }

        h2 {
            text-align: center;
            color: #1565C0;
            font-weight: 700;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .form-label {
            font-weight: 500;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
        }

        .input-group-text {
            cursor: pointer;
            background: white;
        }

        .options {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin: 15px 0;
        }

        .options a {
            text-decoration: none;
            color: #1565C0;
        }

        .btn-login {
            width: 100%;
            background: #1565C0;
            color: white;
            border-radius: 10px;
            padding: 12px;
            border: none;
            font-weight: 600;
            transition: .3s;
        }

        .btn-login:hover {
            background: #0D47A1;
            transform: translateY(-2px);
        }

        .btn-guest {
            width: 100%;
            margin-top: 12px;
            border: 2px solid #1565C0;
            color: #1565C0;
            background: white;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            transition: .3s;
        }

        .btn-guest:hover {
            background: #1565C0;
            color: white;
        }

        .footer {
            margin-top: 18px;
            text-align: center;
            color: #666;
            font-size: 13px;
        }

        .footer a {
            text-decoration: none;
            color: #1565C0;
            font-weight: 600;
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @media(max-width:480px) {

            .login-card {
                padding: 25px;
            }

            h2 {
                font-size: 24px;
            }

        }
    </style>

</head>

<body>

    <div class="login-card">

        <div class="logo">
            <i class="fa-solid fa-hospital-user"></i>
        </div>

        <h2>Diabetes Readmission</h2>

        <p class="subtitle">
            Prediction System
        </p>

        <form id="loginForm">

            <div class="mb-3">
                <label class="form-label">
                    Email Address
                </label>

               <input
    type="email"
    id="emailInput"
    class="form-control"
    placeholder="Enter your email"
    required>
            </div>

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <div class="input-group">

                    <input
    type="password"
    id="passwordInput"
    class="form-control"
    placeholder="Enter your password"
    required>

                    <span class="input-group-text">

                        <i
                            class="fa-solid fa-eye"
                            id="togglePassword"></i>

                    </span>

                </div>

            </div>

            <div class="options">

                <div>

                    <input type="checkbox">

                    Remember Me

                </div>

                <a href="#">

                    Forgot Password?

                </a>

            </div>

            <button
                type="submit"
                class="btn-login">

                <i class="fa-solid fa-right-to-bracket"></i>

                Login

            </button>

            <button
                type="button"
                class="btn-guest"
                onclick="window.location.href='index.html'">

                <i class="fa-solid fa-user"></i>

                Continue as Guest

            </button>

        </form>

        <div class="footer">

            Don't have an account?

            <a href="signup.html">Sign Up</a>
            <br><br>

            Powered by AI & Machine Learning

        </div>

    </div>

    <script>

        const toggle = document.getElementById("togglePassword");

       const password = document.getElementById("passwordInput");

        toggle.addEventListener("click", function () {

            const type = password.type === "password" ? "text" : "password";

            password.type = type;

            this.classList.toggle("fa-eye");

            this.classList.toggle("fa-eye-slash");

        });

      const loginForm = document.getElementById("loginForm");

loginForm.addEventListener("submit", async function (e) {

    e.preventDefault();

    const payload = {
        email: document.getElementById("emailInput").value,
        password: document.getElementById("passwordInput").value
    };

    try {

        const response = await fetch("http://127.0.0.1:5000/api/auth/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(payload)

        });

        const data = await response.json();

        if (!response.ok) {

            alert(data.message);

            return;

        }

        localStorage.setItem("auth_token", data.token);

        localStorage.setItem("user_name", data.user.name);

        

        window.location.href = "index.html";

    }

    catch (error) {

        console.error(error);

        alert("Unable to connect to the server.");

    }

});

    </script>

</body>

</html>
